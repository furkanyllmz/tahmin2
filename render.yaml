# render.yaml
version: "1"

services:
  - type: web
    name: tahmin2        # Render dashboard’daki servis adı
    env: python          # Python ortamı
    plan: starter
    repo: https://github.com/furkanyllmz/tahmin2
    envVars:
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEBUG
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        sync: false
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-post-process --noinput
    startCommand: gunicorn betapp.wsgi:application
    
  # render.yaml (sadece cron kısmı)

  - type: cron
    name: skorupdate-cron
    runtime: python
    repo: https://github.com/furkanyllmz/tahmin2
    plan: starter
    region: oregon
    rootDir: ./
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py skorupdate
    envVars:
      - key: SECRET_KEY
        value: "<django-secret-key>"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "betapp.settings"
      
        
      

