# render.yaml
previewsEnabled: true  # istersen false da olabilir

services:
  # 1) Ana web servisi
  - type: web
    name: tahmin2               # Dashboard’da gözüken servis adı
    runtime: python             # Docker kullanmıyorsan python
    repo: https://github.com/furkanyllmz/tahmin2
    plan: starter
    region: oregon
    rootDir: ./                  # manage.py’nin olduğu dizin
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-post-process --noinput
    startCommand: gunicorn betapp.wsgi:application
    envVars:
      - key: SECRET_KEY
        fromDatabase: false
      - key: DEBUG
        fromDatabase: false
      - key: DJANGO_SETTINGS_MODULE
        fromDatabase: false
      - key: RAPIDAPI_KEY          # senin API anahtarın
        fromDatabase: false
      # vs. diğer envVars'lar…

  # 2) Yarım saatte bir tetiklenecek cron servisi
  - type: cron
    name: skorupdate-cron        # dilediğin bir isim
    runtime: python
    repo: https://github.com/furkanyllmz/tahmin2
    plan: starter
    region: oregon
    rootDir: ./                  # manage.py’nin olduğu dizin
    schedule: "*/30 * * * *"     # her 30 dakikada bir
    command: python manage.py skorupdate
    envVars:
      - key: SECRET_KEY
        fromDatabase: false
      - key: DEBUG
        fromDatabase: false
      - key: DJANGO_SETTINGS_MODULE
        fromDatabase: false
      - key: RAPIDAPI_KEY
        fromDatabase: false
      # web servisiyle aynı envVars’ları eklemelisin
