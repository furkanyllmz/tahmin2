# render.yaml
services:
  - type: web
    name: tahmin2        # Dashboard'da gözüken servis adıyla birebir eşleşmeli
    env: python         # veya docker olarak ayarladığın ortam

cron_jobs:
  - name: skorupdate
    service: betapp     # yukarıda tanımladığın service.name
    schedule: "*/30 * * * *"
    command: "python manage.py skorupdate"
