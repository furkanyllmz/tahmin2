# render.yaml
version: "1"

services:
  - type: web
    name: tahmin2        # Dashboard'da gözüken servis adıyla birebir eşleşmeli
    env: python          # Burada runtime değil env kullanıyoruz
    plan: starter
    repo: https://github.com/furkanyllmz/tahmin2
    envVars:
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEBUG
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        sync: false
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-post-process --noinput
    startCommand: gunicorn betapp.wsgi:application

cron_jobs:
  - name: skorupdate               # Cron job’un adı
    service: tahmin2              # Yukarıdaki service.name ile birebir
    schedule: "*/30 * * * *"      # Her 30 dakikada bir
    command: "python manage.py skorupdate"
