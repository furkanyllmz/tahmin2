# render.yaml
version: "1"

services:
  - type: web
    name: tahmin2
    runtime: python
    repo: https://github.com/furkanyllmz/tahmin2
    plan: starter
    envVars:
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEBUG
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        sync: false
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-post-process --noinput
    startCommand: gunicorn betapp.wsgi:application
    domains:
      - tahminai.com
      - www.tahminai.com
    autoDeployTrigger: commit

cron_jobs:
  - name: skorupdate
    service: tahmin2
    schedule: "*/30 * * * *"        # Her 30 dakikada bir
    command: "python manage.py skorupdate"
